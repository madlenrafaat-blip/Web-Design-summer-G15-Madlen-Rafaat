<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animals Hover Effect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="team-container">
        <div class="card">
            <div class="card-img">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=500&q=80" alt="Golden Retriever">
            </div>
            <div class="card-info">
                <h3>Golden Retriever</h3>
                <p>Friendly Dog</p>
            </div>
        </div>
        <div class="card">
            <div class="card-img">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80" alt="Cute Cat">
            </div>
            <div class="card-info">
                <h3>Cute Cat</h3>
                <p>Lazy Cat</p>
            </div>
        </div>
        <div class="card">
            <div class="card-img">
                <img src="https://images.unsplash.com/photo-1535268647677-300dbf3d78d1?auto=format&fit=crop&w=500&q=80" alt="Panda">
            </div>
            <div class="card-info">
                <h3>Panda Bear</h3>
                <p>Sweet Panda</p>
            </div>
        </div>

    </div>

</body>
</html>
